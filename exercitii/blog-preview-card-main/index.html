  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Blog preview card</title>
</head>
<body>
  <main>
  
    <article class="card">
  
      <img class="card__svg" src="assets/images/illustration-article.svg" alt="illustration" width="420" height="251">
      
      <div class="card__data">
        <mark class=" card__category">Learning</mark>
        <p class="card__date">Published 21 Dec 2023</p>
      </div>
      
      <div class="card__content">
        <h2 class="card__title">HTML & CSS foundations</h2>
        <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>

      <div class="card__creator">
        <img class="card__person" src="assets/images/image-avatar.webp" alt="Greg Hooper" width="45" height="45">
        <p class="card__name">Greg Hooper</p>
      </div>
  
    </article>
  
  </main>
</body>
</html>
